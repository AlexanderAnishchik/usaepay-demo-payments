# Customer deletion includes a vault key in the URL. Keep it out of access logs.
log_format payment_api '$request_method /api/ $status';

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to the backend container
    location /api/ {
        access_log /var/log/nginx/access.log payment_api;
        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # SPA fallback – serve index.html for all non-asset routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
